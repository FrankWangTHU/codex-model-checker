name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:browser
        env:
          CMC_BROWSER_PATH: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-checker-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish tagged version
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v0.1.0' }
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; keeping published assets unchanged."; exit 0 }
          gh release create $version release/*.exe release/*.zip release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Codex Model Checker $version" --notes-file RELEASE_NOTES.md
